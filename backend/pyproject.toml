[project]
name = "voxarcana-local-api"
version = "0.1.0"
description = "API local de TTS do VoxArcana"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "qwen-tts",
    "soundfile>=0.13,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.12,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
